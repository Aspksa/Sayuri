<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141925"><title>Sayuri — Чат</title>
<style>
:root{color-scheme:dark;--bg:#0e111a;--side:#171d29;--panel:#121824;--bubble:#232c3c;--accent:#b59bef;--line:#ffffff17;--text:#f3f1fa;--muted:#9da6bb;--out:#3c3562}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{display:grid;grid-template-columns:292px minmax(0,1fr);height:100dvh}.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}.logo,.assistant-avatar{display:grid;place-items:center;background:linear-gradient(135deg,#b7a4ea,#715ba0);color:#1c1537;font-weight:800;border-radius:50%}.logo{width:38px;height:38px;font-size:24px}.brand b{font-size:20px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.025em}.sidebar-actions{display:grid;gap:10px;padding:10px 14px}.new{border:1px solid #8f79bc80;background:#372e50;color:#f7edff;border-radius:12px;text-align:left;padding:12px 14px}.search{width:100%;border:1px solid var(--line);background:#101622;color:var(--text);border-radius:11px;padding:11px 13px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:15px 20px 5px}.threads{overflow-y:auto;padding:0 9px;flex:1}.thread{border:0;background:transparent;color:var(--text);text-align:left;border-radius:11px;padding:12px 11px;width:100%;display:block;margin:3px 0}.thread:hover,.thread.active{background:#ffffff12}.thread strong{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thread span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-footer{border-top:1px solid var(--line);padding:13px 17px;color:var(--muted);font-size:12px}.main{display:flex;flex-direction:column;min-width:0;position:relative}.topbar{height:69px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 25px;background:#121722}.assistant-avatar{width:37px;height:37px;flex:0 0 auto;font-size:23px}.contact{flex:1;min-width:0}.contact strong{display:block;font-size:15px}.contact small{color:var(--muted);font-size:12px}.iconbtn{border:0;color:#d3cde6;background:transparent;border-radius:9px;padding:8px 11px}.iconbtn:hover{background:#ffffff15}.mobile-menu{display:none}.messages{flex:1;overflow:auto;scroll-behavior:smooth;padding:26px 22px 16px}.messages-inner{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:18px;min-height:100%}.welcome{text-align:center;margin:auto;padding:35px 10px}.welcome .big{font-size:55px}.welcome h1{font-size:31px;font-weight:600;margin:10px 0}.welcome p{color:var(--muted);max-width:420px;margin:auto}.msg{max-width:min(75%,670px);padding:12px 17px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 5px 24px #00000015}.msg.assistant{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:5px}.msg.user{align-self:flex-end;background:var(--out);border-bottom-right-radius:5px}.msg .who{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#d3c1ff}.msg small{font-size:10px;display:block;text-align:right;color:#bdc0d2;margin-top:5px}.msg .attachment{border-top:1px solid #ffffff25;margin-top:9px;padding-top:9px;color:#e4d2ff;font-size:12px}.composer-area{padding:12px max(20px,calc((100% - 890px)/2)) 18px;background:linear-gradient(transparent,#0e111a 25%)}.composer{display:flex;align-items:end;gap:8px;background:#202636;border:1px solid #ffffff24;border-radius:19px;padding:11px}.composer textarea{width:100%;resize:none;max-height:145px;min-height:32px;background:none;border:none;outline:none;color:var(--text);padding:6px 4px;line-height:1.45}.send{background:#ad92e5;border:0;color:#241c3b;border-radius:12px;height:38px;min-width:44px;font-size:19px;font-weight:800}.send:hover{background:#cab5f6}.tip{text-align:center;color:#828ba1;font-size:11px;margin-top:9px}.draft-file{font-size:12px;color:#e8d6ff;padding:4px 10px 0}.toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#41375d;color:#fff;padding:9px 14px;border-radius:12px;max-width:85%;box-shadow:0 8px 30px #0007;z-index:10}.hidden{display:none!important}.overlay{display:none}.empty{color:var(--muted);padding:12px}@media(max-width:720px){.shell{display:block}.sidebar{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(85vw,310px);transform:translateX(-105%);transition:transform .2s}.shell.nav-open .sidebar{transform:none}.shell.nav-open .overlay{display:block;position:fixed;inset:0;background:#0009;z-index:20}.main{height:100dvh}.mobile-menu{display:inline-block}.topbar{padding:0 11px}.messages{padding:18px 12px}.msg{max-width:88%}.composer-area{padding:8px 10px max(12px,env(safe-area-inset-bottom))}.welcome h1{font-size:26px}}
</style></head><body>
<div class="shell" id="shell"><div class="overlay" id="overlay"></div>
<aside class="sidebar" aria-label="История чатов"><div class="brand"><span class="logo">✿</span><div><b>SAYURI</b><small>ВАША КИЦУНЭ-ПОМОЩНИЦА</small></div></div><div class="sidebar-actions"><button class="new" id="newChat">＋ Новый чат</button><input class="search" id="search" placeholder="⌕ Поиск диалогов" aria-label="Поиск диалогов"></div><div class="section-label">Диалоги</div><div class="threads" id="threads"></div><div class="sidebar-footer">♧ Личный кабинет · скоро<br>История хранится только в этом браузере</div></aside>
<main class="main"><header class="topbar"><button class="iconbtn mobile-menu" id="menu" aria-label="Открыть меню">☰</button><div class="assistant-avatar">✿</div><div class="contact"><strong>Саюри</strong><small id="connection">Облачный ИИ ещё не подключён</small></div><button class="iconbtn" id="deleteChat" title="Удалить текущий диалог" aria-label="Удалить текущий диалог">♻</button></header>
<section class="messages" id="messages" aria-live="polite"><div class="messages-inner" id="messagesInner"></div></section>
<footer class="composer-area"><div class="draft-file hidden" id="draftFile"></div><form class="composer" id="composer"><button type="button" class="iconbtn" id="attach" title="Прикрепить файл" aria-label="Прикрепить файл">＋</button><input type="file" class="hidden" id="file" multiple><textarea id="input" rows="1" placeholder="Сообщение Саюри..." aria-label="Написать сообщение"></textarea><button class="send" type="submit" aria-label="Отправить">➤</button></form><div class="tip">Enter — отправить · Shift+Enter — новая строка · для ИИ требуется сервер Cloud.ru</div></footer><div class="toast hidden" id="toast"></div></main></div>
<script>
(()=>{'use strict';const KEY='sayuri.chat.v1';const $=s=>document.querySelector(s);const shell=$('#shell'),threads=$('#threads'),inner=$('#messagesInner'),input=$('#input'),file=$('#file');let chats=[],active=null,pending=[];try{const data=JSON.parse(localStorage.getItem(KEY)||'{}');if(Array.isArray(data.chats))chats=data.chats.filter(x=>x&&Array.isArray(x.messages));active=data.active||null}catch{}const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({chats,active}))}catch{toast('Недостаточно места для сохранения истории')}};function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3300)}function newChat(){const c={id:uid(),title:'Новый чат',messages:[],updated:Date.now()};chats.unshift(c);active=c.id;pending=[];file.value='';$('#draftFile').classList.add('hidden');persist();render();shell.classList.remove('nav-open');input.focus()}function current(){return chats.find(c=>c.id===active)}function time(ms){return new Date(ms).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}function renderThreads(){const q=$('#search').value.toLowerCase().trim();threads.textContent='';const sorted=[...chats].sort((a,b)=>b.updated-a.updated).filter(c=>(c.title+' '+c.messages.map(m=>m.text).join(' ')).toLowerCase().includes(q));if(!sorted.length){const e=document.createElement('div');e.className='empty';e.textContent='Диалоги не найдены';threads.append(e)}for(const c of sorted){const b=document.createElement('button');b.className='thread'+(c.id===active?' active':'');const title=document.createElement('strong'),preview=document.createElement('span');title.textContent=c.title;preview.textContent=c.messages.length?c.messages[c.messages.length-1].text.slice(0,65):'Начните разговор';b.append(title,preview);b.onclick=()=>{active=c.id;persist();render();shell.classList.remove('nav-open')};threads.append(b)}}function render(){renderThreads();inner.textContent='';const c=current();if(!c||!c.messages.length){const w=document.createElement('div');w.className='welcome';const logo=document.createElement('div');logo.className='big';logo.textContent='✿';const h=document.createElement('h1');h.textContent='Здравствуйте, Господин';const p=document.createElement('p');p.textContent='Я Саюри. Здесь будут ваши беседы, файлы и знания. Для настоящих ответов нужно подключить серверное ядро к Cloud.ru.';w.append(logo,h,p);inner.append(w)}else for(const m of c.messages){const node=document.createElement('article');node.className='msg '+m.role;const who=document.createElement('span');who.className='who';who.textContent=m.role==='user'?'Вы':'Саюри';const txt=document.createElement('div');txt.textContent=m.text;const stamp=document.createElement('small');stamp.textContent=time(m.at);node.append(who,txt);if(m.files?.length){const a=document.createElement('div');a.className='attachment';a.textContent='📎 '+m.files.join(' · ');node.append(a)}node.append(stamp);inner.append(node)}$('#messages').scrollTop=$('#messages').scrollHeight}$('#composer').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text&&!pending.length)return;const c=current();c.messages.push({role:'user',text,files:pending.map(f=>f.name),at:Date.now()});if(c.messages.length===1)c.title=(text||pending[0]?.name||'Новый чат').slice(0,48);c.updated=Date.now();input.value='';pending=[];file.value='';$('#draftFile').classList.add('hidden');persist();render();toast('Сообщение сохранено локально. Подключите API ядра для ответа Саюри.')});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#composer').requestSubmit()}});$('#attach').onclick=()=>file.click();file.onchange=()=>{pending=[...file.files];const box=$('#draftFile');box.classList.toggle('hidden',!pending.length);box.textContent=pending.length?'📎 '+pending.map(x=>x.name).join(', '):'';if(pending.length)toast('Файлы пока выбираются только по имени: загрузка на сервер ещё не подключена.')};$('#newChat').onclick=newChat;$('#deleteChat').onclick=()=>{if(!current())return;if(!confirm('Удалить текущий диалог из этого браузера?'))return;chats=chats.filter(c=>c.id!==active);active=chats[0]?.id||null;if(!active)return newChat();persist();render()};$('#search').oninput=renderThreads;$('#menu').onclick=()=>shell.classList.add('nav-open');$('#overlay').onclick=()=>shell.classList.remove('nav-open');if(!current())newChat();else render()})();
</script></body></html>
