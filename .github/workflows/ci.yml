name: Sayuri tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q run.py server
      - run: node --check web/app.js && node --check web/sidebar.js
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sayuri-ui-previews
          path: ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 14
